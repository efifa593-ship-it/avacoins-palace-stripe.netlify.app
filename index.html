<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Gallery</title>
<meta name="theme-color" content="#000">
<style>
  :root {
    --bg: #000;
    --glass: rgba(20,20,30,0.6);
    --accent: #a855f7;
    --purple: #c084fc;
    --text: #fff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }
  header {
    background: linear-gradient(135deg, #1a0033, #4c1d95);
    padding: 20px 20px 24px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, #a855f780, transparent 70%);
    opacity: 0.4;
  }
  .header-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    z-index: 2;
  }
  .profile-img {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    object-fit: cover;
    border: 3.5px solid #fff;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
  }
  .title {
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .counter {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--glass);
    color: var(--purple);
    padding: 10px 26px;
    border-radius: 22px;
    font-weight: 700;
    font-size: 16px;
    backdrop-filter: blur(16px);
    border: 1px solid #333;
    z-index: 99;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    padding: 24px;
    padding-bottom: 120px;
  }
  .card {
    position: relative;
    aspect-ratio: 1;
    border-radius: 24px;
    overflow: hidden;
    background: #0a0a0a;
    box-shadow: 0 12px 40px rgba(0,0,0.8);
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .card:hover {
    transform: scale(1.04) translateY(-8px);
    box-shadow: 0 20px 60px rgba(168, 85, 247, 0.4);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .video-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .actions {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    opacity: 0;
    transition: all 0.3s ease;
  }
  .card:hover .actions { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .btn {
    width: 52px;
    height: 52px;
    border-radius: 18px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    font-size: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.9); }
  .fab {
    position: fixed;
    left: 24px;
    bottom: 28px;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent), #e879f9);
    color: white;
    border: none;
    border-radius: 22px;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 12px 40px rgba(168,85,247,0.6);
    z-index: 1000;
  }
  .empty {
    text-align: center;
    padding: 140px 30px 60px;
    color: #888;
  }
  .empty div { font-size: 100px; margin: 30px 0; opacity: 0.7; }
  .empty h2 { font-size: 32px; font-weight: 800; margin: 20px 0; }
  .empty p { font-size: 18px; opacity: 0.8; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <!-- AQUI ESTÁ O NOVO GATINHO QUE VOCÊ ESCOLHEU -->
    <img src="https://th.bing.com/th/id/R.47d9ac57f12f64dcf7a1f3acc2a1a5fa?rik=DSQjoOC98As6vg&riu=http://meusanimais.com.br/wp-content/uploads/2015/06/gato.jpg&ehk=OHLZ4iRGXJOrOdI+Jj+D3j8BJDcEgZRK/6R1pE2nqjA=&risl=&pid=ImgRaw&r=0" alt="Gatinho" class="profile-img">
    <div class="title">INGRID SANTOS</div>
  </div>
</header>

<div class="counter" id="c">0 itens</div>

<div class="empty" id="empty">
  <div>Photo</div>
  <h2>Sua galeria privada</h2>
  <p>Toque na tela para começar</p>
</div>

<div class="grid" id="grid"></div>
<button class="fab" id="all" title="Baixar tudo">Download</button>

<script>
// Vision Gallery 2025 — com o novo gatinho
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const counter = document.getElementById('c');
let db;

const dbReq = indexedDB.open("VisionGallery2025", 3);
dbReq.onupgradeneeded = e => e.target.result.createObjectStore("m", {keyPath:"id", autoIncrement:true});
dbReq.onsuccess = e => { db = e.target.result; load(); };

// Thumbnail para vídeo
function getThumb(file, cb) {
  const v = document.createElement('video');
  v.muted = true; v.preload = "metadata";
  v.src = URL.createObjectURL(file);
  v.onloadeddata = () => v.currentTime = 0.1;
  v.onseeked = () => {
    const c = document.createElement('canvas');
    c.width = 400; c.height = 400;
    c.getContext('2d').drawImage(v, 0, 0, 400, 400);
    c.toBlob(b => { cb(URL.createObjectURL(b)); URL.revokeObjectURL(v.src); }, 'image/webp', 0.9);
  };
}

// Salvar
function save(file) {
  const r = new FileReader();
  r.onload = e => {
    const video = file.type.startsWith('video/');
    if (video) {
      getThumb(file, thumb => addToDB(e.target.result, thumb, file));
    } else {
      addToDB(e.target.result, e.target.result, file);
    }
  };
  r.readAsDataURL(file);
}

function addToDB(data, thumb, file) {
  const tx = db.transaction("m","readwrite");
  tx.objectStore("m").add({
    n: file.name || (file.type.startsWith('video/')?"video.mp4":"foto.jpg"),
    d: data,
    t: thumb,
    v: file.type.startsWith('video/'),
    s: file.size,
    dt: Date.now()
  });
  tx.oncomplete = updateCount;
}

// Criar card
function card(item) {
  const c = document.createElement('div'); c.className="card";
  c.innerHTML = item.v 
    ? `<img src="${item.t}"><div class="video-badge">Play</div>`
    : `<img src="${item.d}">`;

  c.innerHTML += `
    <div class="actions">
      <button class="btn" title="Baixar">Download</button>
      <button class="btn" title="Apagar">Delete</button>
    </div>
  `;

  c.querySelector('.btn').onclick = ev => { ev.stopPropagation(); download(item.d, item.n); };
  c.querySelector('.btn:last-child').onclick = ev => {
    if(confirm("Apagar para sempre?")) {
      db.transaction("m","readwrite").objectStore("m").delete(item.id);
      c.style.transition="0.5s"; c.style.transform="scale(0)"; c.style.opacity="0";
      setTimeout(()=>c.remove(),500); updateCount();
    }
  };

  let t; c.ontouchstart=()=>t=setTimeout(()=>c.querySelector('.btn:last-child').click(),800);
  c.ontouchend=c.ontouchmove=()=>clearTimeout(t);

  grid.prepend(c);
}

// Carregar
function load() {
  db.transaction("m").objectStore("m").getAll().onsuccess = e => {
    const l = e.target.result.sort((a,b)=>b.dt - a.dt);
    updateCount(l.length);
    l.length ? empty.style.display="none" : empty.style.display="block";
    l.forEach(card);
  };
}

function updateCount() {
  db.transaction("m").objectStore("m").count().onsuccess=e=>counter.textContent=e.target.result+" itens";
}

function download(src,name){const a=document.createElement("a");a.href=src;a.download=name;a.click();}

// Adicionar mídia
document.body.onclick=e=>{
  if(e.target.closest('.card')||e.target.id==="all")return;
  const i=document.createElement("input");
  i.type="file";i.accept="image/*,video/*";i.multiple=true;
  i.onchange=()=>Array.from(i.files).forEach(save);
  i.click();
};

// Baixar tudo
document.getElementById("all").onclick=()=>{
  db.transaction("m").objectStore("m").getAll().onsuccess=e=>{
    const l=e.target.result;
    if(!l.length)return alert("Nada salvo");
    l.forEach((i,x)=>setTimeout(()=>download(i.d,i.n),x*80));
    alert(l.length+" arquivos baixados");
  };
};
</script>
</body>
</html>
